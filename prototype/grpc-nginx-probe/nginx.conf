worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;

events { worker_connections 1024; }

http {
    # 场景 B:默认配置(最小 grpc_pass)——观察默认透传行为
    server {
        listen 50052;
        http2 on;
        location / {
            grpc_pass grpc://127.0.0.1:50051;
        }
    }

    # 场景 C:调优配置——显式放宽超时 + keepalive,供对比
    server {
        listen 50053;
        http2 on;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
        grpc_socket_keepalive on;
        location / {
            grpc_pass grpc://127.0.0.1:50051;
        }
    }
}
