syntax = "proto3";

package awardie.ai;

// AI Worker 契约(v1 LangGraph 编排 1:1 保留,仅接口层 gRPC 化,N1 非目标)
// 流式口径与探针 P1 结论一致:server-streaming 走 Nginx 需 grpc_read_timeout>=300s。
service AiService {
  // 抽取:文件 → 结构化数据(unary,v1 framework.extract 同步语义)
  rpc Extract (ExtractRequest) returns (ExtractResponse);
  // 模板抽取:样本图 → 强制 award 抽取器的结构化字段(unary,架构票;v1 extract-for-create 语义)
  rpc ExtractTemplate (ExtractTemplateRequest) returns (ExtractTemplateResponse);
  // 模板 prompt 生成:模板规则+样本文本 → 提示词(unary,架构票;v1 generate-prompt-for-create 语义)
  rpc GeneratePrompt (GeneratePromptRequest) returns (GeneratePromptResponse);
  // 抽取+审核全链:流式过程事件(node 进度/答案增量)+ 最终审核结论(server-streaming)
  rpc ExtractAndReview (ExtractRequest) returns (stream WorkflowEvent);
  // AI 问答(RAG):流式答案增量(server-streaming)
  rpc Ask (AskRequest) returns (stream AnswerEvent);
  // 健康探针
  rpc Health (HealthRequest) returns (HealthResponse);
}

message ExtractRequest {
  string file_path = 1;
  bool use_ocr_cache = 2;
  bool use_llm_cache = 3;
  string trace_id = 4;
}

message ExtractResponse {
  int32 code = 1;            // 0 成功;4003=AI 不可用(沿 v1 语义);5xxx=内部错误
  string message = 2;
  string doc_type = 3;       // award/patent/software/innovation/other/空=未识别
  string data_json = 4;      // 结构化抽取结果
  double confidence = 5;
  string ocr_text = 6;       // 截断至 500 字符(对齐 v1 AgentState 语义)
  string status = 7;
  string error_message = 8;
  string trace_id = 9;
}

message WorkflowEvent {
  string trace_id = 10;
  oneof event {
    NodeEvent node = 1;      // LangGraph 节点进度(extraction/review/supervisor...)
    TextDelta delta = 2;     // 答案节点增量(白名单节点,T49 语义)
    ReviewFinal final = 3;   // 终态:审核结论
  }
}

message NodeEvent { string node = 1; }

message TextDelta { string text = 1; }

message ReviewFinal {
  string decision = 1;          // pass / reject / need_manual
  string issues_json = 2;       // [{"field","issue","severity"}]
  string suggestion = 3;        // 自然语言建议
  string extraction_json = 4;   // {doc_type,data,confidence,ocr_text}
  int32 code = 5;               // 0 正常;4003=Worker 降级
  string message = 6;
  string disclaimer = 7;        // BR-2:AI 建议仅辅助参考
}

message AskRequest {
  string question = 1;
  string trace_id = 2;
}

// 架构票《AI Worker extract/prompt RPC 扩展》(2026-09-03 立项):templates 域解锁载体。
// template_rule_json 当前为扩展位(强制 award 抽取不消费规则),规则化抽取属后续演进。
message ExtractTemplateRequest {
  bytes image = 1;               // 样本图内容(multipart 直传,样本图未落盘场景)
  string filename = 2;           // 原始文件名(判后缀落临时文件)
  string template_rule_json = 3; // 模板规则 {keywords,sample_extracted,default_fields,...}(扩展位)
  bool use_ocr_cache = 4;
  bool use_llm_cache = 5;
  string trace_id = 6;
}

message ExtractTemplateResponse {
  int32 code = 1;                // 0 成功;4004=图不可读/抽取失败;4003=AI 依赖不可用;5xxx=内部
  string message = 2;
  string data_json = 3;          // extracted_dict(结构化字段)
  string ocr_text = 4;           // OCR 全文(对齐 v1 extract-for-create:不截断,页面展示用)
  string trace_id = 5;
}

message GeneratePromptRequest {
  string template_rule_json = 1; // {keywords,sample_extracted,default_fields,llm_fields,min_length,max_length,language,need_translate}
  string sample_text = 2;        // 样本 OCR 文本(空则用占位文本,对齐 v1)
  string trace_id = 3;
}

message GeneratePromptResponse {
  int32 code = 1;                // 0 成功;4000=规则 JSON 非法;4003=AI 依赖不可用;5xxx=内部
  string message = 2;
  string prompt = 3;
  string disclaimer = 4;         // BR-2
  string trace_id = 5;
}

message AnswerEvent {
  string trace_id = 10;
  oneof event {
    NodeEvent node = 1;
    TextDelta delta = 2;
    AnswerFinal final = 3;
  }
}

message AnswerFinal {
  string answer = 1;
  string sources_json = 2;      // RAG 检索片段
  int32 code = 3;
  string message = 4;
  string disclaimer = 5;        // BR-2
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  string version = 2;
  bool langgraph_available = 3;
}
