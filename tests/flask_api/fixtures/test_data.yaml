  full_flow_set:
    - "sample_001"  # 蓝桥杯学生奖状
    - "sample_005"  # 发明专利
    - "sample_007"  # 软著
    - "sample_008"  # 其他图片

  # 模板匹配测试组合
  template_match_set:
    - "sample_001"  # 有模板 - 学生
    - "sample_002"  # 有模板 - 教师

  # 无模板测试组合
  no_template_set:
    - "sample_003"  # CISCN
    - "sample_004"  # 睿抗

  # 可见性测试组合
  visibility_test_set:
    - "sample_001"  # 学生A的奖状
    - "sample_002"  # 教师B的奖状

