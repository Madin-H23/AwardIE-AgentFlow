{% extends "user_base.html" %}

{% block title %}成果审核 - 成果管理系统{% endblock %}
{% block extra_head %}
<!-- 工作台组件依赖（门户壳内补充；user_base 未含 bootstrap） -->
<link href="https://unpkg.com/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://unpkg.com/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link href="https://unpkg.com/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<link href="https://unpkg.com/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet" />



<link rel="stylesheet" href="{{ url_for('static', filename='css/console_tokens.css') }}?v=5">

<style>
    /* 门户壳说明：portal-shell 复用整套 tokens 组件（双前缀），但背景交给 user_base 的门户渐变（覆盖 tokens 的 min-height/background） */
    .portal-shell { background: transparent; min-height: auto; }

    /* 门户风对齐：审核内容与教师门户一致（字体/卡片质感）——Bootstrap 引入覆盖了 user_base 的 Noto，此处强置；卡片加浅阴影弱边框贴近门户白卡 */
    .portal-shell h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: .01em; }
    body { font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif !important; }
    .portal-shell .c-panel {
        border-radius: 0.625rem;
        box-shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 0 0 0 rgba(0,0,0,0);
        border-color: color-mix(in srgb, var(--line) 80%, transparent);
    }
    /* 主TAB导航样式 */
    .main-tabs {
        border-bottom: 2px solid color-mix(in srgb, var(--ink) 6%, transparent);
        margin-bottom: 1.5rem;
    }
    .main-tabs .nav-link {
        color: var(--ink-2);
        border: none;
        border-bottom: 3px solid transparent;
        padding: 1rem 1.5rem;
        font-weight: 500;
        transition: all 0.2s;
    }
    .main-tabs .nav-link:hover {
        color: var(--brand);
        border-bottom-color: var(--brand);
    }
    .main-tabs .nav-link.active {
        color: var(--brand);
        background-color: transparent;
        border-bottom-color: var(--brand);
    }

    /* 子TAB导航样式 */
    .sub-tabs-container {
        margin-bottom: 1.5rem;
    }
    .sub-tabs .nav-link {
        padding: 0.5rem 1rem;
        border: none;
        border-bottom: 2px solid transparent;
    }
    .sub-tabs .nav-link.active {
        border-bottom-color: var(--brand);
        background-color: transparent;
        color: var(--brand);
    }

    /* 待处理标题 */
    .pending-title {
        padding: 0.5rem 1rem;
        background-color: color-mix(in srgb, var(--ok) 14%, transparent);
        border-left: 4px solid color-mix(in srgb, var(--ok) 22%, transparent);
        border-radius: 6px;
        margin-bottom: 0;
    }
    .pending-title h3 {
        margin: 0;
        font-size: 1rem;
        color: var(--ink);
    }

    /* 按钮栏 */
    .button-bar {
        padding: 0.5rem 1rem;
        background-color: color-mix(in srgb, var(--ink) 4%, transparent);
        border-radius: 6px;
        margin-bottom: 0;
    }

    /* 紧凑工具栏 - 所有元素在一行 */
    .compact-toolbar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
        padding: 0.75rem 1rem;
        background-color: var(--panel);
        border: 1px solid color-mix(in srgb, var(--ink) 6%, transparent);
        border-radius: 8px;
        margin-bottom: 1rem;
    }
    .compact-toolbar .toolbar-section {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding-right: 0.75rem;
        border-right: 1px solid color-mix(in srgb, var(--ink) 6%, transparent);
    }
    .compact-toolbar .toolbar-section:last-child {
        border-right: none;
        padding-right: 0;
    }
    .compact-toolbar .badge-count {
        font-size: 0.875rem;
        padding: 0.25rem 0.5rem;
        background-color: color-mix(in srgb, var(--ok) 14%, transparent);
        color: white;
        border-radius: 4px;
    }
    .compact-toolbar .nav-buttons .btn {
        padding: 0.375rem 0.75rem;
        font-size: 0.875rem;
    }
    .compact-toolbar .current-index {
        font-size: 0.875rem;
        color: var(--ink-2);
        white-space: nowrap;
    }

    /* 所有模态框居中显示 */
    .modal {
        z-index: 1055;
    }
    .modal-backdrop {
        z-index: 1050;
    }
    .modal.show .modal-dialog {
        display: flex !important;
        align-items: center;
        min-height: 100%;
        margin: 0 auto;
    }
    .modal-dialog {
        display: flex;
        align-items: center;
        min-height: 100%;
        margin: 0 auto;
    }
    .modal-dialog-centered {
        display: flex;
        align-items: center;
        min-height: 100%;
        margin: 0 auto;
    }
    .modal-content {
        margin: auto;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    }

    /* 内容占位符 */
    .content-placeholder {
        text-align: center;
        padding: 5rem 2rem;
        background-color: color-mix(in srgb, var(--ink) 4%, transparent);
        border-radius: 8px;
        color: var(--ink-2);
    }
    .content-placeholder i {
        font-size: 4rem;
        margin-bottom: 1rem;
        opacity: 0.5;
    }

    /* 按钮样式 - 确保主色调 */

    /* 紧凑布局 */
    .form-label.small {
        font-size: 0.875rem;
        margin-bottom: 0.25rem;
    }

    /* Select2样式调整 */
    .select2-container--bootstrap-5 .select2-selection {
        min-height: 38px;
    }
    .select2-container--bootstrap-5 .select2-selection--multiple .select2-selection__choice {
        margin-top: 4px;
        margin-bottom: 4px;
    }

    /* 证书类型按钮组样式 */
    .btn-group .btn-check:checked + .btn {
        background-color: var(--brand);
        border-color: var(--brand);
        color: white;
    }

    /* 隐藏字段的过渡效果 */
    #student_winners_section,
    #teacher_winners_section,
    #supervisors_section,
    #related_students_section {
        transition: opacity 0.2s ease-in-out;
    }
    #student_winners_section[style*="display: none"],
    #teacher_winners_section[style*="display: none"],
    #supervisors_section[style*="display: none"],
    #related_students_section[style*="display: none"] {
        display: none !important;
    }

    /* 学生建议列表样式 */
    #student_suggestions {
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--panel);
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #student_suggestions .suggestion-item {
        cursor: pointer;
        padding: 0.5rem 0.75rem;
    }
    #student_suggestions .suggestion-item:hover,
    #student_suggestions .suggestion-item.active {
        background-color: color-mix(in srgb, var(--ink) 3%, transparent);
    }

    /* 拖拽排序样式 */
    #selected_students_display .badge,
    #selected_teachers_display .badge {
        cursor: move;
        user-select: none;
    }
    #selected_students_display .badge.dragging,
    #selected_teachers_display .badge.dragging {
        opacity: 0.5;
    }
    #selected_students_display .badge.drag-over,
    #selected_teachers_display .badge.drag-over {
        border: 2px dashed var(--brand);
    }

    /* 验证错误样式 */
    .field-error {
        position: relative;
    }
    .field-error .form-control,
    .field-error .form-select {
        border-color: color-mix(in srgb, var(--sev-error) 22%, transparent);
        background-color: var(--sev-error-bg);
    }
    .field-error .form-control:focus,
    .field-error .form-select:focus {
        border-color: color-mix(in srgb, var(--sev-error) 22%, transparent);
        box-shadow: 0 0 0 0.2rem rgba(255, 77, 79, 0.25);
    }
    .field-error-icon {
        position: absolute;
        right: 10px;
        top: 32px;
        color: var(--sev-error);
        font-size: 16px;
        pointer-events: none;
    }
    .field-error-message {
        color: var(--sev-error);
        font-size: 0.75rem;
        margin-top: 0.25rem;
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .field-error-message i {
        font-size: 0.875rem;
    }
    .validation-alert {
        padding: 1rem 1.5rem;
        background-color: var(--sev-warning-bg);
        border-left: 4px solid color-mix(in srgb, var(--sev-warning) 22%, transparent);
        border-radius: 8px;
        margin-bottom: 1.5rem;
    }
    .validation-alert h5 {
        margin: 0 0 0.5rem 0;
        color: var(--sev-warning);
        font-size: 1rem;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .validation-alert ul {
        margin: 0;
        padding-left: 1.5rem;
        color: var(--sev-warning);
    }
    .validation-alert li {
        margin-bottom: 0.25rem;
    }
</style>

{% endblock %}

{% block content %}
<div class="portal-shell">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
{% include 'admin/file_import/partials/_results_content.html' %}
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<!-- 审核工作台 Bootstrap JS 组件（Bootstrap 下拉/模态；user_base 不含 bundle） -->
<script src="https://unpkg.com/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
