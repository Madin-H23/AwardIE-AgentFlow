{% extends "base.html" %}

{% block title %}奖状管理 - 成果管理系统{% endblock %}

{% block content %}
<div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>奖状管理</h1>
    </div>
    
    <!-- Tab导航 -->
    <ul class="nav nav-tabs mb-4" id="awardTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active"
                    id="tab-management" data-bs-toggle="tab" data-bs-target="#pane-management" type="button" role="tab"
                    aria-controls="pane-management" aria-selected="true">
                奖状管理
            </button>
        </li>
    </ul>

    <!-- Tab内容 -->
    <div class="tab-content" id="awardTabContent">
        <!-- Tab1: 奖状管理 -->
        <div class="tab-pane fade show active"
             id="pane-management" role="tabpanel" aria-labelledby="tab-management">
            {% include 'admin/awards/tabs/management.html' %}
        </div>
    </div>
</div>

<script>
// 删除单个奖状（在 /admin/awards 页面中使用）
function deleteAward(id) {
    if (confirm('确定要删除这条奖状吗？')) {
        fetch(`/admin/awards/${id}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // 刷新当前页面
                window.location.reload();
            } else {
                alert(data.message || '删除失败');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('删除失败');
        });
    }
}
</script>
{% endblock %}
