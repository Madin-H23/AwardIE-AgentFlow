<div id="previewContent">
    {% if report_data is defined and report_data|length > 0 %}
    <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
        <table class="table table-striped table-hover table-bordered" style="min-width: 2000px;">
            <thead class="table-light" style="position: sticky; top: 0; z-index: 10;">
                <tr>
                    {% for col in columns %}
                    <th style="white-space: nowrap; padding: 10px;">{{ col }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody id="previewTableBody">
                {% for row in report_data %}
                <tr>
                    {% for col in columns %}
                    <td style="white-space: nowrap; padding: 8px;">{{ row.get(col, '') }}</td>
                    {% endfor %}
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <div class="alert alert-info">
        <i class="bi bi-info-circle"></i> 暂无数据，请设置筛选条件。
    </div>
    {% endif %}
</div>
<span class="badge bg-info" id="totalCountBadge">共 {{ total_count }} 条记录</span>
