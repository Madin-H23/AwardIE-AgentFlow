<!-- ECharts - 多 CDN 备用，与管理员页一致 -->
<script src="{{ url_for('static', filename='vendor/echarts/echarts.min.js') }}"></script>

<script>
// API 配置：根据用户类型确定 API 前缀
const DATA_ANALYSIS_CONFIG = {
    apiPrefix: '{% if current_user and current_user.role == "admin" %}/api/admin{% else %}/api{% endif %}'
};

/**
 * 年份标签筛选组件（复用管理员页面逻辑）
 */
class YearTagFilter {
    constructor(containerId, availableYears, defaultAll = true, onChange) {
        this.container = document.getElementById(containerId);
        this.availableYears = availableYears;
        this.selectedYears = defaultAll ? [...availableYears] : [availableYears[availableYears.length - 1]];
        this.onChange = onChange;
        this.render();
    }

    toggleYear(year) {
        const index = this.selectedYears.indexOf(year);
        if (index > -1) {
            if (this.selectedYears.length > 1) {
                this.selectedYears.splice(index, 1);
            }
        } else {
            this.selectedYears.push(year);
        }
        this.render();
        if (this.onChange) {
            this.onChange(this.selectedYears);
        }
    }

    render() {
        if (!this.container) return;
        this.container.innerHTML = '';
        this.availableYears.forEach(year => {
            const tag = document.createElement('span');
            tag.className = 'year-tag';
            tag.textContent = year;
            if (this.selectedYears.includes(year)) {
                tag.classList.add('selected');
            } else {
                tag.classList.add('unselected');
            }
            tag.addEventListener('click', () => this.toggleYear(year));
            this.container.appendChild(tag);
        });
    }
}

/**
 * 实验室数据分析模块
 * 更新为与管理员页面相同的逻辑
 */
class LaboratoryDataAnalysis {
    constructor(labId) {
        this.labId = labId;
        this.apiPrefix = DATA_ANALYSIS_CONFIG.apiPrefix;
        this.charts = {};
        this.competitions = [];
        this.yearFilter = null;
        this.init();
    }

    async init() {
        try {
            this.initEventListeners();
            await this.loadCompetitions();
            this.renderTab1();
        } catch (error) {
            console.error('初始化失败:', error);
            this.showError('加载数据失败，请刷新页面重试');
        }
    }

    initEventListeners() {
        // Tab切换事件
        const tabButtons = document.querySelectorAll('#analysisTabs .nav-link');
        tabButtons.forEach(button => {
            button.addEventListener('shown.bs.tab', (event) => {
                const tabId = event.target.id;
                this.onTabChange(tabId);
            });
        });

        // 白名单筛选监听
        const whitelistFilter = document.getElementById('tab2WhitelistFilter');
        if (whitelistFilter) {
            whitelistFilter.addEventListener('change', () => {
                this.updateTab2Charts();
            });
        }

        // 教师证书筛选监听
        const teacherCertFilter = document.getElementById('tab2TeacherCertFilter');
        if (teacherCertFilter) {
            teacherCertFilter.addEventListener('change', () => {
                this.updateTab2Charts();
            });
        }
    }

    async loadCompetitions() {
        try {
            const response = await fetch(`${this.apiPrefix}/laboratory/${this.labId}/data-analysis/competitions`, {
                credentials: 'same-origin'
            });
            if (!response.ok) {
                let msg = `HTTP ${response.status}`;
                try {
                    const body = await response.json();
                    if (body && body.message) msg = body.message;
                } catch (_) {}
                throw new Error(msg);
            }
            this.competitions = await response.json();
            console.log('加载竞赛数据:', this.competitions.length, '条');
        } catch (error) {
            console.error('加载竞赛数据失败:', error);
            throw error;
        }
    }

    onTabChange(tabId) {
        console.log('切换到Tab:', tabId);
        setTimeout(() => {
            switch (tabId) {
                case 'tab1-tab':
                    break;
                case 'tab2-tab':
                    this.renderTab2();
                    break;
            }
            this.resizeCharts();
        }, 100);
    }

    // ==================== Tab 1: 竞赛信息 ====================
    renderTab1() {
        this.renderTimelineChart();
        this.renderCompetitionsTable();
    }

    renderTimelineChart() {
        const chartDom = document.getElementById('timelineChart');
        if (!chartDom) {
            console.error('找不到timelineChart容器');
            return;
        }

        if (this.charts.timeline) {
            this.charts.timeline.dispose();
        }

        this.charts.timeline = echarts.init(chartDom);

        const filteredCompetitions = this.competitions;

        if (filteredCompetitions.length === 0) {
            chartDom.innerHTML = '<div class="text-center text-muted p-5">暂无数据</div>';
            return;
        }

        const yAxisData = filteredCompetitions.map(c => c.name);

        const seriesStart = [];
        const seriesMiddle = [];
        const seriesEnd = [];

        filteredCompetitions.forEach(c => {
            if (c.start_month !== null && c.end_month !== null) {
                seriesStart.push([c.start_month, c.name]);

                const midMonth = c.is_cross_year
                    ? this.getMidMonthCross(c.start_month, c.end_month)
                    : (c.start_month + c.end_month) / 2;
                seriesMiddle.push([parseFloat(midMonth.toFixed(1)), c.name]);

                seriesEnd.push([c.end_month, c.name]);
            } else {
                seriesStart.push([null, c.name]);
                seriesMiddle.push([null, c.name]);
                seriesEnd.push([null, c.name]);
            }
        });

        const option = {
            title: {
                text: '竞赛时间分布',
                left: 'center',
                textStyle: {
                    fontSize: 16,
                    fontWeight: 600,
                    color: '#333'
                }
            },
            tooltip: {
                trigger: 'item',
                formatter: params => {
                    if (params.data[0] === null) {
                        return `${params.marker} ${params.data[1]}<br/><span style="color: #999;">时间数据未知</span>`;
                    }
                    const month = Math.floor(params.data[0]);
                    return `${params.marker} ${params.data[1]}<br/>月份: ${month}月`;
                }
            },
            legend: {
                data: ['报名开始', '比赛时间', '出奖时间'],
                top: 30,
                left: 'center'
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                top: 80,
                containLabel: true
            },
            xAxis: {
                type: 'value',
                min: 0.5,
                max: 12.5,
                name: '月份',
                nameLocation: 'middle',
                nameGap: 30,
                interval: 1,
                axisLabel: {
                    formatter: value => {
                        const months = ['', '1月', '2月', '3月', '4月', '5月', '6月',
                                      '7月', '8月', '9月', '10月', '11月', '12月'];
                        return months[Math.floor(value)] || '';
                    }
                }
            },
            yAxis: {
                type: 'category',
                data: yAxisData,
                axisLabel: {
                    width: 180,
                    overflow: 'truncate',
                    ellipsis: '...'
                }
            },
            series: [
                {
                    name: '报名开始',
                    type: 'scatter',
                    symbolSize: 14,
                    data: seriesStart,
                    itemStyle: {
                        color: '#3498db'
                    },
                    emphasis: {
                        itemStyle: {
                            color: '#2980b9'
                        }
                    }
                },
                {
                    name: '比赛时间',
                    type: 'scatter',
                    symbolSize: 14,
                    data: seriesMiddle,
                    itemStyle: {
                        color: '#f39c12'
                    },
                    emphasis: {
                        itemStyle: {
                            color: '#e67e22'
                        }
                    }
                },
                {
                    name: '出奖时间',
                    type: 'scatter',
                    symbolSize: 14,
                    data: seriesEnd,
                    itemStyle: {
                        color: '#27ae60'
                    },
                    emphasis: {
                        itemStyle: {
                            color: '#229954'
                        }
                    }
                }
            ]
        };

        this.charts.timeline.setOption(option);
    }

    getMidMonthCross(start, end) {
        const startToEnd = 12 - start + end;
        const mid = startToEnd / 2;
        const result = start + mid;
        return result > 12 ? result - 12 : result;
    }

    renderCompetitionsTable() {
        const tbody = document.querySelector('#competitionsTable tbody');
        if (!tbody) {
            console.error('找不到competitionsTable tbody');
            return;
        }

        tbody.innerHTML = '';

        if (this.competitions.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">暂无数据</td></tr>';
            return;
        }

        this.competitions.forEach(c => {
            const tr = document.createElement('tr');

            const nameCell = document.createElement('td');
            nameCell.textContent = c.name;
            tr.appendChild(nameCell);

            const timeCell = document.createElement('td');
            if (c.time_raw) {
                const timeText = c.time_raw + (c.is_cross_year ? ' (跨年)' : '');
                timeCell.textContent = timeText;
            } else {
                timeCell.textContent = '-';
                timeCell.className = 'text-muted';
            }
            tr.appendChild(timeCell);

            const websiteCell = document.createElement('td');
            if (c.website) {
                const link = document.createElement('a');
                link.href = c.website;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = '访问';
                link.className = 'btn btn-sm btn-outline-primary';
                websiteCell.appendChild(link);
            } else {
                websiteCell.textContent = '-';
                websiteCell.className = 'text-muted';
            }
            tr.appendChild(websiteCell);

            const whitelistCell = document.createElement('td');
            if (c.white_list) {
                whitelistCell.innerHTML = '<span class="badge bg-success">是</span>';
            } else {
                whitelistCell.innerHTML = '<span class="badge bg-secondary">否</span>';
            }
            tr.appendChild(whitelistCell);

            tbody.appendChild(tr);
        });
    }

    // ==================== Tab 2: 竞赛分析 ====================
    async renderTab2() {
        // 初始化年份筛选组件
        if (!this.yearFilter) {
            const availableYears = this.getAvailableYears();
            this.yearFilter = new YearTagFilter(
                'yearTags',
                availableYears,
                true,  // 默认全选
                () => this.updateTab2Charts()
            );
        }

        // 初始渲染
        await this.updateTab2Charts();
    }

    getAvailableYears() {
        const currentYear = new Date().getFullYear();
        const years = [];
        for (let y = 2022; y <= currentYear + 1; y++) {
            years.push(y);
        }
        return years;
    }

    async updateTab2Charts() {
        if (!this.yearFilter) return;

        const filters = {
            years: this.yearFilter.selectedYears,
            white_list_only: document.getElementById('tab2WhitelistFilter')?.checked || false,
            include_teacher_certificates: document.getElementById('tab2TeacherCertFilter')?.checked || false
        };

        await Promise.all([
            this.renderContributionChart(filters),
            this.renderLabAwardChart(filters)
        ]);
    }

    async renderContributionChart(filters) {
        try {
            const params = new URLSearchParams();
            if (filters.years && filters.years.length > 0) {
                const sortedYears = filters.years.sort((a, b) => a - b);
                params.append('year_range', `${sortedYears[0]},${sortedYears[sortedYears.length - 1]}`);
            }
            if (filters.white_list_only) {
                params.append('white_list_only', 'true');
            }
            if (filters.include_teacher_certificates) {
                params.append('include_teacher_certificates', 'true');
            }

            const response = await fetch(`${this.apiPrefix}/laboratory/${this.labId}/data-analysis/contribution?${params}`, { credentials: 'same-origin' });
            const data = await response.json();

            const chartDom = document.getElementById('contributionChart');
            if (!chartDom) {
                console.error('找不到contributionChart容器');
                return;
            }

            if (this.charts.contribution) {
                this.charts.contribution.dispose();
            }

            if (!data || data.length === 0) {
                chartDom.innerHTML = '<div class="text-center text-muted p-5">暂无数据，请调整筛选条件</div>';
                return;
            }

            this.charts.contribution = echarts.init(chartDom);

            const option = {
                title: {
                    text: '竞赛贡献度（奖状数量）',
                    left: 'center',
                    textStyle: {
                        fontSize: 16,
                        fontWeight: 600,
                        color: '#333'
                    }
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                grid: {
                    left: '25%',
                    right: '5%',
                    bottom: '10%',
                    top: '15%',
                    containLabel: true
                },
                xAxis: {
                    type: 'value',
                    name: '奖状数量'
                },
                yAxis: {
                    type: 'category',
                    data: data.map(d => d.name),
                    axisLabel: {
                        width: 120,
                        overflow: 'truncate'
                    }
                },
                series: [{
                    type: 'bar',
                    data: data.map(d => d.award_count),
                    itemStyle: {
                        color: '#3498db'
                    }
                }]
            };

            this.charts.contribution.setOption(option);
        } catch (error) {
            console.error('渲染贡献度图失败:', error);
        }
    }

    async renderLabAwardChart(filters) {
        try {
            // 获取本实验室各竞赛的获奖数量
            const params = new URLSearchParams();
            if (filters.years && filters.years.length > 0) {
                const sortedYears = filters.years.sort((a, b) => a - b);
                params.append('year_range', `${sortedYears[0]},${sortedYears[sortedYears.length - 1]}`);
            }
            if (filters.white_list_only) {
                params.append('white_list_only', 'true');
            }
            if (filters.include_teacher_certificates) {
                params.append('include_teacher_certificates', 'true');
            }

            const response = await fetch(`${this.apiPrefix}/laboratory/${this.labId}/data-analysis/contribution?${params}`, { credentials: 'same-origin' });
            const data = await response.json();

            const chartDom = document.getElementById('labAwardChart');
            if (!chartDom) {
                console.error('找不到labAwardChart容器');
                return;
            }

            if (this.charts.labAward) {
                this.charts.labAward.dispose();
            }

            if (!data || data.length === 0) {
                chartDom.innerHTML = '<div class="text-center text-muted p-5">暂无数据，请调整筛选条件</div>';
                return;
            }

            this.charts.labAward = echarts.init(chartDom);

            const option = {
                title: {
                    text: '本实验室各竞赛获奖数量',
                    left: 'center',
                    textStyle: {
                        fontSize: 16,
                        fontWeight: 600,
                        color: '#333'
                    }
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    },
                    formatter: '{b}: {c} 项'
                },
                grid: {
                    left: '5%',
                    right: '5%',
                    bottom: '10%',
                    top: '15%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: data.map(d => d.name),
                    axisLabel: {
                        rotate: 45,
                        width: 100,
                        overflow: 'truncate'
                    }
                },
                yAxis: {
                    type: 'value',
                    name: '获奖数量'
                },
                series: [{
                    type: 'bar',
                    data: data.map(d => d.award_count),
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#83bff6' },
                            { offset: 0.5, color: '#188df0' },
                            { offset: 1, color: '#188df0' }
                        ])
                    },
                    emphasis: {
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#2378f7' },
                                { offset: 0.7, color: '#2378f7' },
                                { offset: 1, color: '#83bff6' }
                            ])
                        }
                    }
                }]
            };

            this.charts.labAward.setOption(option);
        } catch (error) {
            console.error('渲染实验室获奖图失败:', error);
        }
    }

    resizeCharts() {
        Object.values(this.charts).forEach(chart => {
            if (chart && !chart.isDisposed()) {
                chart.resize();
            }
        });
    }

    showError(message) {
        const alertDiv = document.createElement('div');
        alertDiv.className = 'alert alert-danger alert-dismissible fade show';
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        document.querySelector('.container-fluid').prepend(alertDiv);
    }
}

// 初始化实验室数据分析
const labId = {{ lab_id }};
document.addEventListener('DOMContentLoaded', () => {
