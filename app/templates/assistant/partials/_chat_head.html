<style>
    /* 助手对话页：DeepSeek 网页端风格（chat.deepseek.com 对话模式）
       布局=顶部模式条 + 会话区(气泡) + 底部大圆角输入条；深浅通过 var(--*) 成对（排障清单 §2）。 */
    .chat-container {
        max-width: 860px; margin: 0 auto;
        height: calc(100vh - 132px); min-height: 420px;
        display: flex; flex-direction: column;
    }
    /* 顶部：标题 + 模式 pill */
    .chat-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px 12px; }
    .chat-head h4 { margin: 0; font-size: 1.05rem; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 8px; }
    .mode-tabs { display: flex; gap: 4px; padding: 3px; margin: 0; list-style: none;
                 background: color-mix(in srgb, var(--ink) 5%, var(--panel));
                 border-radius: 999px; }
    .mode-tabs .nav-link { border: none; border-radius: 999px; padding: 5px 14px; font-size: .82rem;
                 font-weight: 500; color: var(--ink-2); cursor: pointer; transition: all .18s; }
    .mode-tabs .nav-link:hover { color: var(--brand); }
    .mode-tabs .nav-link.active { background: var(--panel); color: var(--brand); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

    /* 模式引导卡（空态附近） */
    .mode-panel { margin: 4px 2px 12px; padding: 12px 16px; border: 1px solid var(--line);
                  border-radius: 14px; background: color-mix(in srgb, var(--brand) 5%, var(--panel)); }
    .mode-panel-title { font-weight: 600; color: var(--brand); font-size: .9rem; margin-bottom: 3px; }
    .mode-panel-desc { color: var(--ink-2); font-size: .84rem; margin-bottom: 8px; }
    .mode-panel-examples { display: flex; flex-wrap: wrap; gap: 6px; }
    .mode-panel-examples .example-chip { padding: 6px 12px; border-radius: 999px; font-size: .8rem; cursor: pointer;
        background: var(--panel); border: 1px solid var(--line); color: var(--ink-2); transition: all .18s; }
    .mode-panel-examples .example-chip:hover { border-color: var(--brand); color: var(--brand); }

    /* 依赖未就绪提示 */
    .cap-warning { margin: 0 2px 12px; padding: 10px 14px; border-radius: 10px; font-size: .82rem;
                   background: var(--sev-warning-bg); color: var(--sev-warning); }

    /* 会话区 */
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
                     padding: 8px 4px 12px; }
    .message { display: flex; gap: 10px; align-items: flex-start; }
    .message.user { flex-direction: row-reverse; }
    .message-avatar { width: 30px; height: 30px; border-radius: 50%; flex: none;
        display: inline-flex; align-items: center; justify-content: center; font-size: .92rem;
        background: color-mix(in srgb, var(--brand) 14%, var(--panel)); }
    .message-bubble { max-width: 78%; padding: 10px 15px; border-radius: 16px;
        font-size: .9rem; line-height: 1.6; color: var(--ink);
        background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
    .message.user .message-bubble { background: color-mix(in srgb, var(--brand) 10%, var(--panel));
        border-color: color-mix(in srgb, var(--brand) 22%, transparent); border-bottom-right-radius: 6px; }
    .message-bubble pre { background: color-mix(in srgb, var(--ink) 4%, transparent); padding: 8px 10px;
        border-radius: 8px; overflow-x: auto; font-size: .82rem; }

    /* LLM 输出 markdown 排版（三个模式统一） */
    .message-bubble p { margin: .25em 0; }
    .message-bubble h3, .message-bubble h4 { margin: .5em 0 .3em; font-weight: 600; line-height: 1.35; }
    .message-bubble ul { margin: .3em 0; padding-left: 1.25em; }
    .message-bubble li { margin: .12em 0; }
    .message-bubble code { background: color-mix(in srgb, var(--ink) 8%, transparent); border-radius: 4px;
        padding: .1em .35em; font-size: .85em; font-family: ui-monospace, Consolas, monospace; }
    .message-bubble blockquote { border-left: 3px solid color-mix(in srgb, var(--brand) 42%, transparent);
        margin: .4em 0; padding: .1em .6em; color: var(--ink-2); }
    .message-bubble .md-table-wrap { overflow-x: auto; margin: .5em 0; }
    .message-bubble table.md-table { width: 100%; border-collapse: collapse; font-size: .85em; }
    .message-bubble table.md-table th, .message-bubble table.md-table td {
        border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
    .message-bubble table.md-table thead th { background: color-mix(in srgb, var(--ink) 4%, transparent); font-weight: 600; }
    .message-bubble a { color: var(--brand); text-decoration: underline; }

    /* 底部输入条（DeepSeek 大圆角悬浮样式） */
    .chat-input-area { padding: 6px 0 2px; }
    .dse-composer { display: flex; align-items: flex-end; gap: 10px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 26px;
        padding: 9px 10px 9px 16px; box-shadow: 0 6px 22px color-mix(in srgb, var(--ink) 8%, transparent);
        transition: border-color .18s, box-shadow .18s; }
    .dse-composer:focus-within { border-color: var(--brand); box-shadow: 0 6px 22px color-mix(in srgb, var(--brand) 14%, transparent); }
    .dse-composer #chatInput { flex: 1; border: none; outline: none; background: transparent;
        color: var(--ink); font-size: .95rem; padding: 6px 0; line-height: 1.4; }
    .dse-composer #chatInput::placeholder { color: var(--ink-2); }
    .dse-round { width: 38px; height: 38px; border-radius: 50%; flex: none; border: none; cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center; }
    .dse-round.ghost { background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink-2); font-size: 1rem; }
    .dse-round.ghost:hover { color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, transparent); }
    .dse-round.send { background: var(--brand); color: #fff; font-size: 1.05rem; }
    .dse-round.send:hover { background: var(--brand-hover); }
    .chat-input-toolbar { display: flex; justify-content: space-between; align-items: center;
        padding: 6px 8px 0; }
    .mode-hint { color: var(--ink-2); font-size: .74rem; }
    .clear-btn { border: none; background: none; color: var(--ink-2); font-size: .78rem; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
    .clear-btn:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink); }
</style>
