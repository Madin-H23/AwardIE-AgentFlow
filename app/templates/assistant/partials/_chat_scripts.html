<script>
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
let currentMode = 'auto';

// 各模式说明、示例、输入提示
const MODE_META = {
    auto: {
        title: '🧭 智能路由',
        desc: '✅ 推荐首选。AI 自动判断你的意图（查知识 / 查数据 / 列清单），无需纠结选哪个。',
        placeholder: '描述你的需求，AI 会自动判断…',
        hint: '智能路由',
        examples: ['帮我梳理一下今年的获奖情况', '挑战杯是什么级别的比赛？'],
    },
    qa: {
        title: '💬 知识问答',
        desc: '查询某个竞赛的等级类别（如"挑战杯是 A 类吗"），基于规则文档回答并附引用。⚠️ 不适合列清单（列清单请用数据操作）。',
        placeholder: '问单个竞赛，如：挑战杯是 A 类吗？',
        hint: '知识问答',
        examples: ['挑战杯是 A 类吗？', '蓝桥杯是什么级别？'],
    },
    tools: {
        title: '🔧 数据操作',
        desc: '查询、统计、导出数据，或列出赛事清单（白名单 / A 类 / B 类）。请给具体条件。',
        placeholder: '如：A 类赛事有哪些？',
        hint: '数据操作',
        examples: ['A 类赛事有哪些？', '哪些是白名单赛事？', '哪些竞赛贡献的奖状最多？'],
    },
};

// 根据模式渲染说明面板、输入提示，并绑定示例点击
function renderModePanel(mode) {
    const m = MODE_META[mode] || MODE_META.auto;
    document.getElementById('modePanelTitle').textContent = m.title;
    document.getElementById('modePanelDesc').textContent = m.desc;
    chatInput.placeholder = m.placeholder;
    document.getElementById('modeHint').textContent = '当前模式：' + m.hint;
    const exBox = document.getElementById('modePanelExamples');
    exBox.innerHTML = '';
    m.examples.forEach(text => {
        const chip = document.createElement('span');
        chip.className = 'example-chip';
        chip.textContent = '💬 ' + text;
        chip.title = '点击发送';
        chip.addEventListener('click', () => {
            chatInput.value = text;
            sendMessage();
        });
        exBox.appendChild(chip);
    });
}

// 模式切换：更新面板与输入提示
document.querySelectorAll('.mode-tabs .nav-link').forEach(link => {
    link.addEventListener('click', (e) => {
        e.preventDefault();
        document.querySelectorAll('.mode-tabs .nav-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
        currentMode = link.dataset.mode;
        renderModePanel(currentMode);
    });
});

// 清空对话
document.getElementById('clearBtn').addEventListener('click', () => {
    chatMessages.innerHTML = '';
    appendMessage('assistant', '对话已清空，继续提问吧。上方示例可直接点击使用。');
});

function appendMessage(role, text, extraHtml = '', raw = false) {
    const avatar = role === 'user' ? '👤' : '🤖';
    const div = document.createElement('div');
    div.className = `message ${role}`;
    const body = raw ? text : renderMarkdown(escapeHtml(text));
    div.innerHTML = `
        <div class="message-avatar">${avatar}</div>
        <div class="message-bubble">${body}${extraHtml}</div>
    `;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div.querySelector('.message-bubble');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// 轻量 markdown 渲染（三模式输出统一排版）：入参=已 HTML 转义文本；
// 仅输出白名单标签（h2-h5/p/ul/li/strong/em/code/pre/blockquote/table/a），标签内容全来自已转义文本，无注入面。
// 支持：代码块/标题/粗斜体/行内码/引用/无序列表/表格/链接。
function renderMarkdown(src) {
    src = String(src);
    // 代码块优先占位，避免被行内规则误伤
    const blocks = [];
    src = src.replace(/```[\r\n]*([\s\S]*?)```/g, (m, code) => {
        blocks.push('<pre><code>' + (code.trim() || ' ') + '</code></pre>');
        return '\u0000BLK' + (blocks.length - 1) + '\u0000';
    });
    const inline = (s) => s
        .replace(/`([^`\n]+)`/g, (m, c) => '<code>' + c + '</code>')
        .replace(/\*\*([^*\n]+)\*\*/g, (m, c) => '<strong>' + c + '</strong>')
        .replace(/\*([^*\n]+)\*/g, (m, c) => '<em>' + c + '</em>')
        .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, (m, t, u) => '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>');
    const renderTable = (rows) => {
        const sepIdx = rows.findIndex(r => /^\s*:?-{2,}[\s:|:-]*$/.test(r.replace(/\|/g, ' ').trim()));
        const hasHead = sepIdx > 0;
        const data = (hasHead ? rows.slice(sepIdx + 1) : rows).filter(Boolean);
        let h = '<div class="md-table-wrap"><table class="md-table">';
        if (hasHead) h += '<thead><tr>' + rows[0].split('|').map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr></thead>';
        h += '<tbody>' + data.map(r => '<tr>' + r.split('|').map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
        return h;
    };
    // 全局逐行状态机：支持跨空行连续无序/有序列表、表格段聚合、标题、引用、代码块/段落
    const srcLines = src.split(/\r?\n/);
    let html = '', inUl = false, inOl = false;
    const flushLists = () => { if (inUl) { html += '</ul>'; inUl = false; } if (inOl) { html += '</ol>'; inOl = false; } };
    const isTableLine = (x) => /^\s*\|.*\|\s*$/.test(x.trim());
    const isBlk = (x) => /^\u0000BLK\d+\u0000$/.test(x.trim());
    for (let i = 0; i < srcLines.length; i++) {
        const raw = srcLines[i];
        // 表格：连续表格行聚合成段
        if (isTableLine(raw)) {
            const tbl = [raw];
            let j = i + 1;
            while (j < srcLines.length && isTableLine(srcLines[j])) { tbl.push(srcLines[j]); j++; }
            flushLists(); html += renderTable(tbl.map(x => x.trim().replace(/^\||\|$/g, '')));
            i = j - 1; continue;
        }
        const t = raw.trim();
        if (!t) continue;                       // 空行：列表保持状态跨空行连续；其余忽略
        if (isBlk(t)) { flushLists(); html += blocks[Number(t.match(/\d+/)[0])]; continue; }
        const hm = t.match(/^(#{1,4})\s+(.*)$/);
        if (hm) { flushLists(); const lv = hm[1].length + 1; html += '<h' + lv + '>' + inline(hm[2]) + '</h' + lv + '>'; continue; }
        if (/^\>\s?/.test(t)) { flushLists(); html += '<blockquote>' + inline(t.replace(/^\>\s?/, '')) + '</blockquote>'; continue; }
        if (/^\s*[-*]\s+/.test(t)) {
            if (inOl) { html += '</ol>'; inOl = false; }
            if (!inUl) { html += '<ul>'; inUl = true; }
            html += '<li>' + inline(t.replace(/^\s*[-*]\s+/, '')) + '</li>'; continue;
        }
        if (/^\s*\d+[.)、]\s+/.test(t)) {
            if (inUl) { html += '</ul>'; inUl = false; }
            if (!inOl) { html += '<ol>'; inOl = true; }
            html += '<li>' + inline(t.replace(/^\s*\d+[.)、]\s+/, '')) + '</li>'; continue;
        }
        flushLists(); html += '<p>' + inline(t) + '</p>';
    }
    flushLists();
    return html;
}

function showTyping() {
    const bubble = appendMessage('assistant',
        '<span class="typing-indicator"><span></span><span></span><span></span></span>', '', true);
    bubble.parentElement.dataset.typing = 'true';
    return bubble;
}

// Agent 配色与图标映射
const AGENT_META = {
    supervisor: { icon: '🧭', label: 'Supervisor 主管' },
    extraction: { icon: '📄', label: '抽取 Agent' },
    review:     { icon: '🔍', label: '审核 Agent' },
    qa:         { icon: '💬', label: '问答 Agent' },
};

// 协作时间线：把后端 steps（异构结构）渲染成竖向节点流
function formatTimeline(steps) {
    if (!steps || !steps.length) return '';
    let html = '<div class="mt-2"><div class="agent-timeline">';
    steps.forEach(s => {
        const key = String(s.agent || s.tool || '').toLowerCase();
        const meta = AGENT_META[key] || { icon: '🔧', label: s.agent || s.tool || '步骤' };
        const cls = AGENT_META[key] ? key : '';
        // 状态/决策 → 徽章
        let badge = '';
        const d = s.decision, st = s.status;
        if (d === 'pass' || st === 'done' || st === 'ok') badge = '<span class="tl-badge ok">✓</span>';
        else if (d === 'need_manual') badge = '<span class="tl-badge warn">需复核</span>';
        else if (d === 'reject' || s.error) badge = '<span class="tl-badge err">✗</span>';
        else if (d) badge = `<span class="tl-badge warn">${escapeHtml(String(d))}</span>`;
        // 详情（兼容各节点写入的异构字段）
        let detail = '';
        if (s.error) detail = s.error;
        else if (s.doc_type) detail = `文档类型：${s.doc_type}`;
        else if (s.issue_count != null) detail = `发现问题 ${s.issue_count} 项`;
        else if (s.sources_count != null) detail = `引用来源 ${s.sources_count} 条`;
        else if (s.output) detail = String(s.output).substring(0, 120);
        else if (s.input) detail = `输入：${String(s.input).substring(0, 80)}`;

        html += `<div class="tl-item ${cls}"><span class="tl-dot"></span>`;
        html += `<span class="tl-name">${meta.icon} ${escapeHtml(meta.label)}</span>`;
        if (st && st !== 'done') html += `<span class="tl-meta"> · ${escapeHtml(String(st))}</span>`;
        html += badge;
        if (detail) html += `<span class="tl-detail">${escapeHtml(String(detail))}</span>`;
        html += '</div>';
    });
    html += '</div></div>';
    return html;
}

// 审核结果卡：决策徽章 + 问题清单 + 建议
const DECISION_META = {
    pass:        { cls: 'pass',        icon: '✓', text: '审核通过' },
    need_manual: { cls: 'need_manual', icon: '⚠', text: '需人工复核' },
    reject:      { cls: 'reject',      icon: '✗', text: '不通过' },
};
const SEV_LABEL = { high: '高', medium: '中', low: '低', info: '提示' };
// 字段中文名映射（抽取结果字段 + 审核问题字段）
const FIELD_LABELS = {
    competition_name: '竞赛名称', award_level: '奖项等级', competition_level: '竞赛级别',
    winner_name: '获奖人', winner: '获奖人', supervisor_name: '指导教师',
    certificate_id: '证书编号', date: '日期', year: '年份', track: '赛道',
    issuer: '颁发机构', province: '省份', group_name: '组别', granted_role: '授予角色',
    project_title: '项目名称', edition: '届别', related_student: '相关学生',
    related_student_name: '相关学生', is_valid_certificate: '证书有效',
    competition_category: '竞赛类别', winner_role: '获奖角色', supervisor_role: '指导教师角色',
    ocr_text: 'OCR 原文',
};
const DOC_TYPE_LABELS = { award: '奖状', patent: '专利', software: '软著', innovation: '大创', other: '其他' };

function formatReview(review) {
    if (!review || !review.decision) return '';
    const dm = DECISION_META[review.decision] || { cls: 'need_manual', icon: '?', text: review.decision };
    let html = '<div class="agent-result-card review-card mt-2">';
    html += '<div class="card-title">🔍 智能审核结果</div>';
    html += `<span class="decision-badge ${dm.cls}">${dm.icon} ${escapeHtml(dm.text)}</span>`;
    const issues = review.issues || [];
    if (issues.length) {
        html += '<ul class="issue-list">';
        issues.forEach(it => {
            const sev = String(it.severity || 'info').toLowerCase();
            const field = it.field ? (FIELD_LABELS[it.field] || it.field) : '';
            html += `<li class="issue-item ${sev}">`;
            if (field) html += `<span class="issue-field">${escapeHtml(field)}</span>: `;
            html += escapeHtml(String(it.issue || ''));
            html += `<span class="sev-tag ${sev}">${SEV_LABEL[sev] || sev}</span></li>`;
        });
        html += '</ul>';
    } else {
        html += '<div class="tl-meta" style="margin-top:.4rem">未发现校验问题 🎉</div>';
    }
    if (review.suggestion) {
        html += `<div class="review-suggestion">💡 ${escapeHtml(String(review.suggestion))}</div>`;
    }
    html += '</div>';
    return html;
}

// 抽取结果卡：文档类型 + 置信度进度条 + 字段表（字段名中文化、跳过空值）
function formatExtraction(extraction) {
    if (!extraction) return '';
    let html = '<div class="agent-result-card extraction-card mt-2">';
    html += '<div class="card-title">📄 信息抽取结果</div>';
    if (extraction.doc_type) {
        const dt = DOC_TYPE_LABELS[extraction.doc_type] || extraction.doc_type;
        html += `<span class="badge bg-light text-dark border mb-2">${escapeHtml(String(dt))}</span> `;
    }
    const conf = extraction.confidence;
    if (typeof conf === 'number') {
        const pct = Math.round(conf * 100);
        const color = conf > 0.9 ? '#52c41a' : conf > 0.7 ? '#1890ff' : '#faad14';
        html += `<div class="confidence-row">
            <span class="tl-meta">置信度</span>
            <div class="confidence-bar"><span style="width:${pct}%;background:${color}"></span></div>
            <span class="tl-meta" style="min-width:38px;text-align:right">${pct}%</span>
        </div>`;
    }
    const data = extraction.data || {};
    const keys = Object.keys(data).filter(k => {
        const v = data[k];
        return v !== null && v !== undefined && v !== '' && v !== false;
    });
    if (keys.length) {
        html += '<dl class="row extract-fields mt-1">';
        keys.forEach(k => {
            let v = data[k];
            if (v === true) v = '是';
            html += `<dt class="col-sm-4">${escapeHtml(FIELD_LABELS[k] || k)}</dt><dd class="col-sm-8">${escapeHtml(String(v))}</dd>`;
        });
        html += '</dl>';
    }
    html += '</div>';
    return html;
}

function formatSources(sources) {
    if (!sources || !sources.length) return '';
    let html = '<div class="mt-2"><small>📚 引用来源：</small><br>';
    sources.forEach(s => {
        const label = s.name || s.competition_name || JSON.stringify(s).substring(0, 40);
        const meta = [s.level, s.category].filter(Boolean).join(' / ');
        html += `<span class="source-card">${escapeHtml(label)}${meta ? ' (' + escapeHtml(meta) + ')' : ''}</span>`;
    });
    html += '</div>';
    return html;
}

async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    appendMessage('user', text);
    chatInput.value = '';
    sendBtn.disabled = true;

    // FR-UI-04：流式优先（SSE 逐 token），失败自动回退同步 fetch
    const streamed = await sendStreamed(text);
    if (streamed) { sendBtn.disabled = false; chatInput.focus(); return; }

    const typingBubble = showTyping();

    try {
        const resp = await fetch('/assistant/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: text, mode: currentMode}),
        });
        const data = await resp.json();

        // 移除 typing
        typingBubble.parentElement.remove();

        if (data.error) {
            appendMessage('assistant', '❌ ' + data.error);
            return;
        }
        const extra = formatReview(data.review) + formatExtraction(data.extraction)
            + formatTimeline(data.steps) + formatSources(data.sources);
        const modeTag = data.mode_used ? `<div class="mt-1"><small class="text-muted">模式：${escapeHtml(data.mode_used)}</small></div>` : '';
        appendMessage('assistant', data.answer, extra + modeTag);
    } catch (err) {
        typingBubble.parentElement.remove();
        appendMessage('assistant', '❌ 网络错误：' + err.message);
    } finally {
        sendBtn.disabled = false;
        chatInput.focus();
    }
}

// ── SSE 流式发送（FR-UI-04）：qa 模式逐 token 打字机；其他模式后端发整段 delta，同一消费逻辑 ──
async function sendStreamed(text) {
    return new Promise((resolve) => {
        let es;
        try {
            es = new EventSource('/assistant/chat/stream?message='
                + encodeURIComponent(text) + '&mode=' + currentMode);
        } catch (e) { resolve(false); return; }

        const contentEl = appendMessage('assistant', '');   // 空气泡逐 token 填充（返回 bubble 元素）

        let acc = '', gotAny = false;
        const bail = () => { try { contentEl.closest('.message').remove(); } catch (_) {} };
        const failTimer = setTimeout(() => {
            if (!gotAny) { es.close(); bail(); resolve(false); }
        }, 15000);

        es.addEventListener('progress', (e) => {
            gotAny = true; clearTimeout(failTimer);
            try {
                const d = JSON.parse(e.data);
                if (d.label) contentEl.innerHTML = '<div class="text-muted small"><span class="spinner-border spinner-border-sm me-1"></span>'
                    + escapeHtml(d.label) + '…</div>';
            } catch (_) {}
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });
        es.addEventListener('delta', (e) => {
            gotAny = true; clearTimeout(failTimer);
            try { acc += JSON.parse(e.data).text; } catch (_) {}
            contentEl.innerHTML = escapeHtml(acc) + '<span style="opacity:.6">▍</span>';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });
        es.addEventListener('done', (e) => {
            let d = null; try { d = JSON.parse(e.data); } catch (_) {}
            es.close(); clearTimeout(failTimer);
            const modeTag = d && d.mode_used
                ? `<div class="mt-1"><small class="text-muted">模式：${escapeHtml(d.mode_used)}</small></div>` : '';
            const srcs = (d && d.sources && d.sources.length) ? formatSources(d.sources) : '';
            contentEl.innerHTML = renderMarkdown(escapeHtml((d && d.answer) || acc)) + srcs + modeTag;
            chatMessages.scrollTop = chatMessages.scrollHeight;
            resolve(true);
        });
        es.addEventListener('error', () => {
            es.close(); clearTimeout(failTimer);
            if (!gotAny) { bail(); resolve(false); }      // 连接失败回退同步路径
            else {
                contentEl.innerHTML = escapeHtml(acc)
                    + '<div class="mt-1 text-danger small">⚠ 连接中断，以上为部分回答</div>';
                resolve(true);
            }
        });
    });
}

sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

// 上传奖状 → 多智能体抽取 + 审核（让 extraction/review Agent 串联跑起来）
const uploadBtn = document.getElementById('uploadBtn');
const awardFile = document.getElementById('awardFile');
uploadBtn.addEventListener('click', () => awardFile.click());
awardFile.addEventListener('change', () => {
    if (awardFile.files && awardFile.files[0]) {
        const f = awardFile.files[0];
        awardFile.value = '';  // 重置，允许重复选同一文件
        uploadAndExtract(f);
    }
});

async function uploadAndExtract(file) {
    appendMessage('user', `📎 上传奖状：${file.name}`);
    sendBtn.disabled = true;
    uploadBtn.disabled = true;
    const typingBubble = showTyping();
    const fd = new FormData();
    fd.append('file', file);
    try {
        const resp = await fetch('/assistant/extract', { method: 'POST', body: fd });
        const data = await resp.json();
        typingBubble.parentElement.remove();
        if (data.error) {
            appendMessage('assistant', '❌ ' + data.error);
            return;
        }
        const hasResult = data.extraction || data.review;
        const answer = hasResult ? '已完成奖状抽取与智能审核，结果如下：'
                                 : '未能完成抽取，请查看下方协作过程。';
        const extra = formatReview(data.review) + formatExtraction(data.extraction)
            + formatTimeline(data.steps);
        const modeTag = '<div class="mt-1"><small class="text-muted">模式：抽取 + 审核</small></div>';
        appendMessage('assistant', answer, extra + modeTag);
    } catch (err) {
        typingBubble.parentElement.remove();
        appendMessage('assistant', '❌ 上传失败：' + err.message);
    } finally {
        sendBtn.disabled = false;
        uploadBtn.disabled = false;
    }
}

// 初始化默认模式面板
renderModePanel(currentMode);
</script>
