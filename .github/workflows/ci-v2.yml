# v2 CI(Ticket #12):Java 测试 + 前端门禁
# 与 v1 的 ci.yml(Python,main 维护常态)并存;触发 v2 分支
name: ci-v2

on:
  push:
    branches: ['refactor/v2-stack-migration', 'main']
  pull_request:

jobs:
  backend-v2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: awardie_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend tests (Flyway V1 baseline + fixture self-seeding,32 例)
        run: mvn -B test
        working-directory: awardie-backend

  frontend-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
        working-directory: awardie-frontend
      - name: Lint
        run: npm run lint
        working-directory: awardie-frontend
      - name: Raw-control gate (Element Plus whitelist convention)
        run: python scripts/check_raw_controls.py
      - name: JDBC placeholder audit (columns/?/args three-way)
        run: python scripts/check_jdbc_placeholders.py
      - name: Build (vue-tsc + vite)
        run: npm run build
        working-directory: awardie-frontend

  e2e-v2:
    runs-on: ubuntu-latest
    needs: [backend-v2, frontend-v2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: awardie_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: E2E full-stack run (backend + vite + playwright in one step)
        run: |
          mvn -B -q package -DskipTests -f awardie-backend/pom.xml
          java -jar awardie-backend/target/awardie-backend-0.1.0-SNAPSHOT.jar --spring.profiles.active=seed > seed.log 2>&1 || true
          grep -q "seeded" seed.log && echo "[seed] OK"
          nohup java -jar awardie-backend/target/awardie-backend-0.1.0-SNAPSHOT.jar > backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18080/actuator/health && break; sleep 2; done
          npm install --prefix awardie-frontend
          nohup npm run dev --prefix awardie-frontend -- --port 5199 --host > vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5199/v2/ > /dev/null && break; sleep 2; done
          cd awardie-frontend
          npx playwright install --with-deps chromium
          npx playwright test 2>&1 || (cat vite.log ../backend.log && exit 1)
          cd ..
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: awardie-frontend/test-results/
