spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/awardie_dev
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # V1__baseline.sql 由 scripts/v2_migrate.py 生成并经 psql 建表;
    # Java 侧仅做 baseline 标记(adopt legacy),后续 schema 变更加 V2+ 文件
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 18080  # 8080 被本机未知 python http.server 长期占用(2026-08-29 实测),dev 用 18080;生产/Nginx 配置按部署环境定

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"

ai:
  worker:
    mode: fake   # fake=确定性事件流(开发/CI);grpc=真实 Worker(127.0.0.1:50060)
    host: 127.0.0.1
    port: 50060
