# nginx 反向代理（部署设计 §1：SSE 独立池 + 大小限制）
upstream api_pool { server app-api:5001; }
upstream sse_pool { server app-sse:5002; }

server {
    listen 80;
    client_max_body_size 100m;          # P1-23：与 Flask 层 100MB 对齐

    # SSE 专用 location：禁缓冲 + 长读超时（CR-5）
    location = /assistant/chat/stream {
        proxy_pass http://sse_pool;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }

    location /static/ {
        proxy_pass http://api_pool;
        expires 7d;
    }

    location / {
        proxy_pass http://api_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
