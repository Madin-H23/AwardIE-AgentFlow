# ============================================================
# v2 dev Nginx 配置(含探针 P1 硬条目,#10 分流时启用)
# 用法:拷至 nginx conf,替换 5199/18080/5001 为实际部署值
# 依据:prototype/grpc-nginx-probe/FINDINGS.md
#   - grpc_pass 默认无缓冲,server-streaming 逐条透传
#   - 默认 grpc_read_timeout 60s 会在 idle>60s 时 RST_STREAM(实测断流)
#   - 因此 AI 链路必须显式放宽超时 + keepalive
# ============================================================
worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;

events { worker_connections 1024; }

http {
    server {
        listen 5199;
        http2 on;

        # 纵切面 API → v2 Java(18080)
        location /api/v2/ {
            grpc_read_timeout 300s;      # 探针 P1 硬条目(≥300s,对齐 LLM 最长推理)
            grpc_send_timeout 3600s;
            grpc_socket_keepalive on;
            proxy_read_timeout 300s;     # SSE 同源超时
            proxy_pass http://127.0.0.1:18080;
        }

        # v2 前端静态(Vite build 产物 dist/)
        location / {
            proxy_read_timeout 300s;
            proxy_pass http://127.0.0.1:5199;
        }

        # 其余路径 → v1 Flask(长尾并存,业务不中断)
        location / {
            proxy_pass http://127.0.0.1:5001;
        }
    }
}
