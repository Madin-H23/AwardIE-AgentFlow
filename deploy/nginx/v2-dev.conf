# ============================================================
# v2 统一入口 Nginx 配置(#10 路径分流,dev 实测版)
#   5199     → v2 前端静态 + SPA(Vite build 产物,base=/v2/)
#   /api/v2/ → v2 Java(18080;含探针 P1 gRPC/SSE 硬条目)
#   其余     → v1 Flask(5001,长尾并存业务不中断)
# 启停:
#   cd D:/Develop/tools/nginx-win/nginx-1.28.0
#   copy /y <repo>/deploy/nginx/v2-dev.conf conf/nginx.conf && start nginx.exe
#   nginx.exe -s stop
# 依据:prototype/grpc-nginx-probe/FINDINGS.md(grpc_read_timeout>=300s 硬条目)
# ============================================================
worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;

    server {
        listen 8090;

        # --- v2 纵切面 API(Java 18080)---
        location /api/v2/ {
            grpc_read_timeout 300s;      # 探针 P1 硬条目
            grpc_send_timeout 3600s;
            grpc_socket_keepalive on;
            proxy_read_timeout 300s;     # SSE 同源超时
            proxy_pass http://127.0.0.1:18080;
        }

        # --- v2 前端静态 + SPA fallback(base=/v2/)---
        location /v2/ {
            alias "D:/Develop/AI 应用开发/AI应用开发项目/AwardIE-AgentFlow/awardie-frontend/dist/";
            try_files $uri $uri/ /v2/index.html;
        }

        # --- 其余全部 → v1 Flask(长尾并存)---
        location / {
            proxy_read_timeout 300s;
            proxy_pass http://127.0.0.1:5001;
        }
    }
}
